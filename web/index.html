<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secretary</title>
<!--
  The front end ADR-020 predicted and ADR-025 finally built.

  One file, no build step, no framework, no dependency it has to fetch
  from a CDN. It is a client of the HTTP API exactly like chat.py is --
  it imports nothing from the system it drives, and everything it can do
  is something curl could do. If a feature cannot be built here, that is
  an API gap worth fixing in server.py.

  Served from the same origin as the API (GET /), which is why there is
  no CORS entry in server.py and no base URL in this file: a relative
  "/chat/stream" can only ever mean the process that sent this page.
-->
<style>
  :root {
    --bg: #14161a;  --panel: #1b1e24;  --line: #2a2f38;
    --text: #e6e8ec; --dim: #8b93a1;   --accent: #7aa2f7;
    --user: #232a36; --err: #f7768e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .spacer { flex: 1; }
  header .thread {
    color: var(--dim); font-size: 13px;
    font-family: ui-monospace, Consolas, monospace;
  }
  button {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }

  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .turn { max-width: 780px; margin: 0 auto 18px; }
  .who { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  /* pre-wrap, not markdown: replies cite email ids and quote subjects,
     and a markdown renderer eats the underscores and asterisks inside
     them. The same call chat.py makes, for the same reason. */
  .body { white-space: pre-wrap; overflow-wrap: break-word; }
  .turn.user .body {
    background: var(--user); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px;
  }
  .tool {
    color: var(--dim); font-size: 12.5px;
    font-family: ui-monospace, Consolas, monospace;
    border-left: 2px solid var(--line); padding: 2px 0 2px 10px;
    margin: 6px 0; white-space: pre-wrap; word-break: break-all;
  }
  .thinking {
    color: var(--dim); font-size: 13.5px; font-style: italic;
    border-left: 2px solid var(--line); padding: 2px 0 2px 10px;
    margin: 6px 0; white-space: pre-wrap;
  }
  .error { color: var(--err); white-space: pre-wrap; }
  .cursor::after {
    content: "|"; color: var(--accent);
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 12px 16px;
  }
  form {
    max-width: 780px; margin: 0 auto;
    display: flex; gap: 8px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
    font: inherit; max-height: 200px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .hint {
    max-width: 780px; margin: 6px auto 0;
    font-size: 12px; color: var(--dim);
  }
</style>
</head>
<body>

<header>
  <h1>Secretary</h1>
  <span class="thread" id="threadLabel"></span>
  <span class="spacer"></span>
  <button id="newBtn" type="button">New thread</button>
</header>

<div id="log"></div>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask about your mail..." autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter sends &middot; Shift+Enter for a new line &middot; read-only access (ADR-003)</div>
</footer>

<script>
// The thread id, kept in localStorage so a reload CONTINUES the
// conversation instead of starting one. That is ADR-022 being useful
// rather than merely true, and it carries chat.py's trade with it: every
// turn resends the whole thread, so "New thread" is how you stop paying
// for context you no longer need.
const THREAD_KEY = "secretary.thread";
let thread = localStorage.getItem(THREAD_KEY) || "web";

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const threadLabel = document.getElementById("threadLabel");

function showThread() { threadLabel.textContent = thread; }

document.getElementById("newBtn").onclick = () => {
  thread = "web-" + new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
  localStorage.setItem(THREAD_KEY, thread);
  log.replaceChildren();
  showThread();
  input.focus();
};

// --- rendering -------------------------------------------------------------
//
// Everything below writes with textContent, never innerHTML. Model output
// quotes email subjects and bodies, which are untrusted third-party text
// (ADR-004) -- innerHTML would let a <script> in somebody's subject line
// run inside the one page that can talk to your inbox. textContent cannot
// do that, and being unable to is the point.

function turn(who) {
  const el = document.createElement("div");
  el.className = "turn " + who;
  const label = document.createElement("div");
  label.className = "who";
  label.textContent = who === "user" ? "you" : "secretary";
  el.append(label);
  log.append(el);
  return el;
}

function block(parent, cls, before) {
  const el = document.createElement("div");
  el.className = cls;
  parent.insertBefore(el, before || null);
  return el;
}

// "Follow the answer, unless the reader scrolled up to read something."
// Measured BEFORE the append, because appending changes scrollHeight.
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;

// --- one turn --------------------------------------------------------------

async function ask(message) {
  const mine = turn("user");
  block(mine, "body").textContent = message;

  const theirs = turn("assistant");
  // The blinking cursor is also the insertion point: every new block goes
  // before it, so it stays at the end of the growing answer and is simply
  // removed when the run finishes.
  const cursor = block(theirs, "body cursor");
  log.scrollTop = log.scrollHeight;

  // One "open" element per kind of event. Consecutive text deltas append
  // to the same node; a tool call closes it, so text after a tool starts
  // a fresh paragraph. That is what makes a multi-step run read as a
  // sequence rather than one smeared blob.
  let text = null, thinking = null;

  const finish = () => {
    cursor.remove();
    send.disabled = false;
    input.focus();
  };

  const fail = (why) => { block(theirs, "error", cursor).textContent = why; };

  let response;
  try {
    response = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: message, thread_id: thread }),
    });
  } catch (e) {
    fail("Cannot reach the server. Is `python server.py` still running?");
    finish();
    return;
  }
  if (!response.ok) {
    fail("HTTP " + response.status + ": " + (await response.text()).slice(0, 300));
    finish();
    return;
  }

  const handle = (event) => {
    const stick = atBottom();
    if (event.type === "text") {
      thinking = null;
      if (!text) text = block(theirs, "body", cursor);
      text.textContent += event.text;
    } else if (event.type === "thinking") {
      text = null;
      if (!thinking) thinking = block(theirs, "thinking", cursor);
      thinking.textContent += event.text;
    } else if (event.type === "tool") {
      text = thinking = null;
      block(theirs, "tool", cursor).textContent =
        "-> " + event.name + "(" + JSON.stringify(event.input) + ")";
    } else if (event.type === "error") {
      text = thinking = null;
      fail(event.text);
    }
    // "done" needs no handling: the stream ending is what ends the turn.
    if (stick) log.scrollTop = log.scrollHeight;
  };

  // SSE parsed by hand, because EventSource only speaks GET and this is a
  // POST with a body. The format is small enough to be worth the twelve
  // lines: events are separated by a blank line, each carrying one
  // `data:` line of JSON.
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  try {
    for (;;) {
      const chunk = await reader.read();
      if (chunk.done) break;
      // stream: true, because a multi-byte character can be split across
      // two network chunks and decoding each one alone would corrupt it.
      buffer += decoder.decode(chunk.value, { stream: true });
      // A chunk may hold several events, or half of one. Only complete
      // events -- everything up to a blank line -- are parsed; the
      // remainder stays in the buffer until the rest of it arrives.
      let cut;
      while ((cut = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, cut);
        buffer = buffer.slice(cut + 2);
        for (const line of frame.split("\n")) {
          if (line.startsWith("data:")) handle(JSON.parse(line.slice(5)));
        }
      }
    }
  } catch (e) {
    fail("Connection dropped mid-answer. The server may have finished the "
       + "run anyway, and the turn is checkpointed either way (ADR-022).");
  }
  finish();
}

// --- input -----------------------------------------------------------------

form.onsubmit = (e) => {
  e.preventDefault();
  const message = input.value.trim();
  // send.disabled is the only guard against a second run on the same
  // thread: two concurrent turns would interleave their writes into one
  // checkpointed history.
  if (!message || send.disabled) return;
  input.value = "";
  input.style.height = "auto";
  send.disabled = true;
  ask(message);
};

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});

showThread();
</script>
</body>
</html>
